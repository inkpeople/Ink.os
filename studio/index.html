<style>
:root{color-scheme:dark;--bg:#101111;--panel:#191a1a;--panel2:#222323;--line:#333431;--gold:#d8b46b;--muted:#a5a49e;--text:#f3f0e9;--green:#6ec5a2;--red:#f08c82;--blue:#80b8f1;--purple:#c0a0f0;--orange:#efa17f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 16px;background:linear-gradient(135deg,#1e1c18,#121313);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:14px;background:var(--gold);color:#151515;display:grid;place-items:center;font-weight:950;font-size:19px}.brand h1{font-size:19px;margin:0;letter-spacing:1.5px}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:1px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:22px}.welcome h2{font-size:27px;margin:0 0 4px}.welcome p{color:var(--muted);margin:0;font-size:13px}.chip{border:1px solid #514735;color:var(--gold);border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap}.content{padding:18px;max-width:100%;overflow:hidden}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;gap:4px;overflow:auto;background:#171818;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));justify-content:flex-start}.nav button{flex:0 0 auto;min-width:68px;background:transparent;border:0;color:var(--muted);padding:7px 9px;border-radius:10px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:#383126;color:var(--gold)}h2,h3,h4,p{margin-top:0}h2{font-size:22px;margin-bottom:5px}h3{font-size:16px;margin-bottom:10px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}.stat .icon{font-size:20px;color:var(--gold)}.stat .value{font-size:23px;font-weight:800;margin:6px 0 1px;overflow-wrap:anywhere}.stat .label{font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.sectionhead h3{margin:0}.btn{border:1px solid var(--line);border-radius:10px;background:#2a2b29;color:var(--text);padding:10px 12px;font-weight:650;font-size:12px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#171614}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;background:#101111;border:1px solid #42423e;border-radius:10px;padding:11px 12px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{resize:vertical;min-height:88px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.full{grid-column:1/-1}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;font-size:14px}.itemmain small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.money{color:var(--gold);font-weight:750;white-space:nowrap;font-size:13px}.tag{display:inline-flex;border-radius:7px;padding:4px 7px;font-size:10px;background:#333;color:#ddd}.tag.gold{background:#3a3325;color:var(--gold)}.legend{display:flex;gap:8px 12px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:4px 0}.day{border:1px solid var(--line);background:#1a1b1b;border-radius:9px;min-height:48px;padding:5px 2px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}.day.selected{border-color:var(--gold);background:#3a3325;color:var(--gold)}.day.today{box-shadow:inset 0 0 0 1px #8b754b}.dots{display:flex;gap:3px;min-height:5px}.dots i{display:block;width:5px;height:5px;border-radius:50%}.progress{height:8px;background:#393a37;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);border-radius:99px}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.empty b{display:block;font-size:24px;margin-bottom:7px}.notice{border:1px solid #514735;background:#28241d;color:#d9c9a7;padding:12px;border-radius:12px;font-size:12px}.barline{margin:12px 0}.barline .row{font-size:12px;margin-bottom:6px}.barline .progress i{background:var(--blue)}.hidden{display:none!important}.photo{width:45px;height:45px;border-radius:12px;object-fit:cover;background:#39352d;display:grid;place-items:center;font-size:20px;color:var(--gold);overflow:hidden;flex-shrink:0}.checkrow{display:flex;align-items:flex-start;gap:9px;padding:10px 0}.checkrow input{width:18px;margin-top:3px;accent-color:var(--gold)}.checkrow label{font-size:13px}.toast{position:fixed;z-index:20;left:50%;bottom:90px;transform:translateX(-50%);background:#e6d1a3;color:#171717;padding:10px 15px;border-radius:12px;font-size:13px;box-shadow:0 6px 30px #0008;max-width:90vw}.footnote{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
@media(min-width:760px){.nav{position:sticky;top:0;bottom:auto;justify-content:center;padding:10px;border-bottom:1px solid var(--line);border-top:0}.nav button{font-size:12px;min-width:90px}.nav button span{display:inline;margin-right:5px;font-size:14px}.content{padding:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.calendar-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.welcome h2{font-size:34px}.top{padding:25px 28px}.card{padding:17px}}
.auth-overlay{position:fixed;inset:0;z-index:50;background:#0d0e0e;display:flex;align-items:center;justify-content:center;padding:18px}.auth-box{width:min(440px,100%);background:#191a1a;border:1px solid #514735;border-radius:20px;padding:22px;box-shadow:0 20px 80px #0009}.auth-box h2{color:var(--gold);margin:0 0 6px}.auth-box p{color:var(--muted);font-size:13px}.auth-message{font-size:12px;color:var(--gold);margin-top:10px;min-height:18px}
</style>

<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">INK</div><div><h1>INK.OS STUDIO</h1><p>TATTOO ARTIST WORKSPACE</p></div></div><div class="welcome"><div><h2 id="greeting">Твоя студия</h2><p id="todayLabel"></p></div><div style="display:flex;align-items:center;gap:7px"><span class="chip">● ЛИЧНАЯ CRM</span><button class="btn ghost" id="accountButton" type="button" hidden>Выйти</button></div></div></header>
<nav class="nav" id="nav"></nav>
<main class="content" id="content"></main>
</div><div id="toast" class="toast hidden"></div><div class="auth-overlay" id="authOverlay"><div class="auth-box"><div class="brand"><div class="mark">INK</div><div><h1>INK.OS STUDIO</h1><p>ЛИЧНАЯ CRM ТАТУ-МАСТЕРА</p></div></div><h2 style="margin-top:24px" id="authTitle">Вход в аккаунт</h2><p id="authDesc">Данные клиентов и финансов будут доступны только в твоём аккаунте.</p><form id="authForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Минимум 6 символов"></div><button class="btn primary" style="width:100%" id="authSubmit">Войти</button></form><div class="auth-message" id="authMessage"></div><div class="btnrow" style="margin-top:12px"><button class="btn ghost" id="authToggle" type="button">Создать аккаунт</button><button class="btn ghost" id="offlineMode" type="button">Пока без аккаунта</button></div><p class="footnote">При регистрации может потребоваться подтверждение email.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const KEY="inkos-studio-v1";
const TYPES={"Сеанс":"#d8b46b","Коррекция":"#80b8f1","Консультация":"#c0a0f0","Выходной":"#7c8795","Модель":"#efa17f","Учёба":"#6ec5a2","Ген. уборка":"#aaa99f"};
const NAV=[["home","⌂","Главная"],["calendar","▦","Календарь"],["clients","♙","Клиенты"],["finance","↗","Финансы"],["projects","▤","Проекты"],["students","✎","Ученики"],["stock","▣","Склад"],["forms","☑","Анкеты"]];
const today=new Date(); let selectedDate=iso(today), viewMonth=new Date(today.getFullYear(),today.getMonth(),1), page="home", modal=false;
let state=load();
const SUPABASE_URL="https://jgzzdsittnzomedvsspj.supabase.co";
const SUPABASE_KEY="sb_publishable_z40zmd4oAy9jUr3Q4BgDYQ_-IpiIlJe";
let sb=null,currentUser=null,cloudReady=false,syncTimer=null,authBusy=false,authMode="login";
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateObj(s){return new Date(s+"T12:00:00")}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function defaults(){return {events:[],clients:[],projects:[],students:[],stock:[{id:uid(),name:"Картриджи",brand:"Ambition",count:12,min:10,unit:"шт."},{id:uid(),name:"Трансферная бумага",brand:"A4",count:18,min:5,unit:"листов"},{id:uid(),name:"Бандажный бинт",brand:"Стандарт",count:8,min:10,unit:"рулонов"}],forms:[],expenses:[],settings:{shop:"https://medexclusive-tattoo.ru/"}}}
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return defaults()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));if(sb&&currentUser&&cloudReady){clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{try{const {error}=await sb.from("inkos_studio_user_data").upsert({user_id:currentUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;setSyncMessage("Синхронизировано")}catch(e){setSyncMessage("Ошибка синхронизации: "+(e.message||"ошибка"))}},700)}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rub(n){return (Number(n)||0).toLocaleString("ru-RU")+" ₽"}
function niceDate(s,opts){return dateObj(s).toLocaleDateString("ru-RU",opts||{day:"numeric",month:"long"})}
function sameMonth(s,d){const x=dateObj(s);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}
function evFor(s){return state.events.filter(e=>e.date===s).sort((a,b)=>a.time.localeCompare(b.time))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2400)}
function setPage(p){page=p;modal=false;render()}
function title(t,sub){return '<div class="sectionhead"><div><h3>'+t+'</h3>'+(sub?'<div class="muted small">'+sub+'</div>':'')+'</div></div>'}
function btn(text,fn,kind){return '<button class="btn '+(kind||"")+'" data-action="'+fn+'">'+text+'</button>'}
function cardStat(icon,label,value,sub){return '<div class="card stat"><div class="icon">'+icon+'</div><div class="value">'+value+'</div><div class="label">'+label+'</div>'+(sub?'<div class="muted small" style="margin-top:5px">'+sub+'</div>':'')+'</div>'}
function itemEvent(e){const c=TYPES[e.type]||"#d8b46b";return '<div class="item"><span class="dot" style="background:'+c+'"></span><div class="itemmain"><strong>'+esc(e.time)+' · '+esc(e.name||e.type)+'</strong><small>'+esc(e.type)+' · '+esc(e.duration||"Время не указано")+(e.note?" · "+esc(e.note):"")+'</small></div><div class="money">'+rub(e.price)+'</div></div>'}
function renderNav(){document.getElementById("nav").innerHTML=NAV.map(n=>'<button class="'+(page===n[0]?"active":"")+'" data-page="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join("")}
function render(){renderNav();const accountButton=document.getElementById("accountButton");if(accountButton){accountButton.hidden=!currentUser;accountButton.textContent=currentUser?"Выйти":"";}document.getElementById("todayLabel").textContent=today.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});document.getElementById("greeting").textContent=({home:"Твоя студия",calendar:"Календарь мастера",clients:"Клиенты",finance:"Финансы",projects:"Проекты",students:"Ученики",stock:"Склад студии",forms:"Анкеты и согласия"})[page]||"INK.OS";const c=document.getElementById("content");c.innerHTML=({home:homePage,calendar:calendarPage,clients:clientsPage,finance:financePage,projects:projectsPage,students:studentsPage,stock:stockPage,forms:formsPage})[page]();wire()}
function homePage(){const todays=evFor(iso(today)),tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);const tom=evFor(iso(tomorrow));const planned=todays.reduce((s,e)=>s+Number(e.price||0),0);return '<div class="grid">'+cardStat("♙","Клиентов сегодня",todays.filter(e=>e.clientId||e.name).length,"Записей в календаре") +cardStat("₽","План на сегодня",rub(planned),"Сумма записей на день")+cardStat("◷","Занято сегодня",todays.reduce((s,e)=>s+(Number(e.minutes)||0),0)?Math.round(todays.reduce((s,e)=>s+(Number(e.minutes)||0),0)/60*10)/10+" ч": "—","По длительности сеансов")+cardStat("▦","Записей завтра",tom.length,"На "+niceDate(iso(tomorrow)))+'</div>'+title("Сегодня · "+niceDate(iso(today)))+'<div class="card">'+(todays.length?todays.map(itemEvent).join(""):'<div class="empty"><b>＋</b>На сегодня записей нет<br>'+btn("Добавить запись","new-event","primary")+'</div>')+'</div>'+title("Завтра · "+niceDate(iso(tomorrow)))+'<div class="card">'+(tom.length?tom.map(itemEvent).join(""):'<div class="empty">Завтра пока свободно</div>')+btn("Открыть календарь","go-calendar","ghost")+'</div>'+title("Быстрые действия")+'<div class="btnrow">'+btn("＋ Новая запись","new-event","primary")+btn("＋ Клиент","new-client")+btn("＋ Расход","new-expense")+btn("Склад","go-stock")+'</div>'+(state.stock.some(x=>x.count<=x.min)?'<div class="notice" style="margin-top:14px">⚠️ Заканчиваются расходники: '+state.stock.filter(x=>x.count<=x.min).map(x=>esc(x.name)).join(", ")+'</div>':'')}
function calendarPage(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const s=iso(new Date(y,m,d)),es=evFor(s);cells+='<button class="day '+(s===selectedDate?'selected ':'')+(s===iso(today)?'today':'')+'" data-date="'+s+'">'+d+'<span class="dots">'+[...new Set(es.map(e=>e.type))].slice(0,4).map(t=>'<i style="background:'+TYPES[t]+'"></i>').join("")+'</span></button>'}return '<div class="legend">'+Object.entries(TYPES).map(([k,v])=>'<span><i class="dot" style="background:'+v+'"></i>'+k+'</span>').join("")+'</div><div class="calendar-wrap"><div>'+title("Календарь")+'<div class="card"><div class="row"><button class="btn" data-action="prev-month">‹</button><strong>'+viewMonth.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</strong><button class="btn" data-action="next-month">›</button></div><div class="calendar" style="margin-top:12px">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w=>'<div class="weekday">'+w+'</div>').join("")+cells+'</div></div></div><div>'+title(niceDate(selectedDate)+" · записи")+'<div class="card">'+(evFor(selectedDate).length?evFor(selectedDate).map(e=>itemEvent(e)+'<div class="btnrow" style="margin:0 0 10px 20px">'+btn("Изменить","edit-event:"+e.id)+btn("Удалить","delete-event:"+e.id,"danger")+'</div>').join(""):'<div class="empty">Свободный день</div>')+btn("＋ Добавить запись","new-event","primary")+'</div></div></div><div style="margin-top:14px">'+(modal?eventForm():"")+'</div>'}
function eventForm(e){e=e||{};return '<div class="card"><div class="row"><h3>'+(e.id?"Изменить запись":"Новая запись")+'</h3>'+btn("Закрыть","close-modal","ghost")+'</div><form id="eventForm"><input type="hidden" name="id" value="'+esc(e.id||"")+'"><div class="formgrid"><div class="field full"><label>Клиент / название события</label><input name="name" required placeholder="Имя клиента или событие" value="'+esc(e.name||"")+'"></div><div class="field"><label>Дата</label><input name="date" type="date" required value="'+esc(e.date||selectedDate)+'"></div><div class="field"><label>Время начала</label><input name="time" type="time" required value="'+esc(e.time||"12:00")+'"></div><div class="field"><label>Тип</label><select name="type">'+Object.keys(TYPES).map(t=>'<option '+((e.type||"Сеанс")===t?"selected":"")+'>'+t+'</option>').join("")+'</select></div><div class="field"><label>Цена, ₽</label><input name="price" type="number" min="0" value="'+Number(e.price||0)+'"></div><div class="field"><label>Длительность, минут</label><input name="minutes" type="number" min="0" value="'+Number(e.minutes||180)+'"></div><div class="field"><label>Статус оплаты</label><select name="payment"><option value="planned" '+((e.payment||"planned")==="planned"?"selected":"")+'>Запланирована</option><option value="paid" '+(e.payment==="paid"?"selected":"")+'>Оплачено</option><option value="deposit" '+(e.payment==="deposit"?"selected":"")+'>Предоплата</option><option value="debt" '+(e.payment==="debt"?"selected":"")+'>Долг / остаток</option></select></div><div class="field"><label>Предоплата, ₽</label><input name="deposit" type="number" min="0" value="'+Number(e.deposit||0)+'"></div><div class="field full"><label>Заметка</label><textarea name="note" placeholder="Эскиз, зона, иглы, пожелания">'+esc(e.note||"")+'</textarea></div><div class="field full"><label>Проект (необязательно)</label><select name="projectId"><option value="">Не проект</option>'+state.projects.map(p=>'<option value="'+p.id+'" '+(e.projectId===p.id?"selected":"")+'>'+esc(p.name)+' · '+esc(p.kind)+'</option>').join("")+'</select></div></div><button class="btn primary" type="submit">Сохранить запись</button></form></div>'}
function clientsPage(){return title("База клиентов",state.clients.length+" карточек")+'<div class="btnrow">'+btn("＋ Добавить клиента","new-client","primary")+btn("Экспорт CSV","export-clients")+'</div>'+(modal?clientForm():"")+'<div class="field"><label>Поиск клиента</label><input id="clientSearch" placeholder="Имя, телефон, соцсеть..."></div><div id="clientList">'+clientList(state.clients)+'</div>'}
function clientList(list){if(!list.length)return '<div class="card empty"><b>♙</b>Клиентов пока нет. Добавь клиента вручную или создай запись в календаре.</div>';return list.map(c=>'<div class="card client-card" data-search="'+esc((c.name+" "+c.phone+" "+c.social).toLowerCase())+'" style="margin-bottom:10px"><div class="row" style="align-items:flex-start"><div class="photo">'+(c.photo?'<img src="'+esc(c.photo)+'" style="width:100%;height:100%;object-fit:cover">':'♙')+'</div><div style="flex:1;min-width:0"><strong>'+esc(c.name)+'</strong><div class="muted small">'+esc(c.phone||"Телефон не указан")+'</div><div class="muted small">'+esc(c.social||"Соцсети не указаны")+'</div></div>'+btn("⋯","toggle-client:"+c.id)+'</div><div class="client-details hidden" id="details-'+c.id+'"><div class="small muted" style="margin:12px 0">Сеансов: '+state.events.filter(e=>e.clientId===c.id||e.name.toLowerCase()===c.name.toLowerCase()).length+' · Заметки: '+esc(c.notes||"—")+'</div><div class="btnrow">'+(c.phone?'<a class="btn" href="tel:'+esc(c.phone)+'">Позвонить</a>':"")+(c.social?'<a class="btn" href="'+socialUrl(c.social)+'" target="_blank" rel="noopener">Открыть соцсеть</a>':"")+btn("Изменить","edit-client:"+c.id)+btn("Удалить","delete-client:"+c.id,"danger")+'</div></div></div>').join("")}
function socialUrl(s){if(/^https?:\/\//i.test(s))return esc(s);return "https://vk.com/"+encodeURIComponent(s.replace(/^@/,""))}

function financePage(){const m=state.events.filter(e=>sameMonth(e.date,today)),y=state.events.filter(e=>dateObj(e.date).getFullYear()===today.getFullYear()),paid=e=>e.payment==="paid"?Number(e.price||0):e.payment==="deposit"?Number(e.deposit||0):0;const income=m.reduce((s,e)=>s+paid(e),0),planned=m.filter(e=>e.date>=iso(today)).reduce((s,e)=>s+Math.max(0,Number(e.price||0)-Number(e.deposit||0)),0),year=y.reduce((s,e)=>s+paid(e),0),expenses=state.expenses.filter(e=>sameMonth(e.date,today)).reduce((s,e)=>s+Number(e.amount||0),0),sessions=m.filter(e=>e.type==="Сеанс"&&e.payment==="paid"),avg=sessions.length?income/sessions.length:0;return '<div class="notice">Финансы считаются по записям календаря. Отметь оплату как «Оплачено», чтобы она попала в фактический доход. Предоплаты учитываются отдельно от остатка.</div><div class="grid" style="margin-top:12px">'+cardStat("₽","Получено за месяц",rub(income))+cardStat("↗","Остаток по будущим записям",rub(planned))+cardStat("▦","Получено за год",rub(year))+cardStat("⌁","Средний чек",rub(avg))+'</div>'+title("События месяца")+'<div class="card">'+Object.keys(TYPES).map(t=>{const es=m.filter(e=>e.type===t);return '<div class="barline"><div class="row"><span><i class="dot" style="display:inline-block;background:'+TYPES[t]+';margin-right:6px"></i>'+t+'</span><strong>'+es.length+'</strong></div><div class="progress"><i style="width:'+(m.length?es.length/m.length*100:0)+'%;background:'+TYPES[t]+'"></i></div></div>'}).join("")+'<div class="muted small">Всего записей за месяц: '+m.length+' · Сеансов с оплатой: '+sessions.length+'</div></div>'+title("Расходы")+'<div class="card"><div class="row"><div><div class="muted small">Расходы за месяц</div><div class="value">'+rub(expenses)+'</div></div>'+btn("＋ Добавить расход","new-expense","primary")+'</div>'+(modal?expenseForm():"")+(state.expenses.filter(e=>sameMonth(e.date,today)).map(e=>'<div class="item"><div class="itemmain"><strong>'+esc(e.title)+'</strong><small>'+niceDate(e.date)+'</small></div><span class="money">− '+rub(e.amount)+'</span>'+btn("×","delete-expense:"+e.id,"danger")+'</div>').join("")||'<p class="muted small" style="margin-top:12px">Расходов пока нет.</p>')+'</div>'+title("Годовая сводка")+'<div class="card">'+Array.from({length:12},(_,i)=>{const d=new Date(today.getFullYear(),i,1),es=y.filter(e=>dateObj(e.date).getMonth()===i),v=es.reduce((s,e)=>s+paid(e),0);return '<div class="barline"><div class="row"><span>'+d.toLocaleDateString("ru-RU",{month:"long"})+'</span><strong>'+rub(v)+'</strong></div><div class="progress"><i style="width:'+(year?Math.min(100,v/Math.max(1,...Array.from({length:12},(_,j)=>y.filter(e=>dateObj(e.date).getMonth()===j).reduce((s,e)=>s+paid(e),0)))*100):0)+'%"></i></div></div>'}).join("")+'</div>'}

function projectsPage(){return title("Тату-проекты","Отслеживай рукава, ноги, спины и торсы")+'<div class="btnrow">'+btn("＋ Новый проект","new-project","primary")+'</div>'+(modal?projectForm():"")+(state.projects.length?state.projects.map(p=>{const es=state.events.filter(e=>e.projectId===p.id),done=es.filter(e=>e.status==="done").length,plan=Number(p.planned||1),progress=Math.min(100,done/Math.max(1,plan)*100);return '<div class="card" style="margin-top:12px"><div class="row"><div><h3>'+esc(p.name)+'</h3><div class="muted small">'+esc(p.kind)+' · '+esc(p.client||"Клиент не указан")+'</div></div><span class="tag gold">'+Math.round(progress)+'%</span></div><div class="progress" style="margin:13px 0"><i style="width:'+progress+'%"></i></div><div class="grid3"><div><strong>'+done+'</strong><div class="muted small">Завершено</div></div><div><strong>'+Math.max(0,plan-done)+'</strong><div class="muted small">Осталось</div></div><div><strong>'+plan+'</strong><div class="muted small">План</div></div></div><div class="btnrow" style="margin-top:14px">'+btn("+ Сеанс","project-add-session:"+p.id,"primary")+btn("+ Увеличить план","project-increase:"+p.id)+btn("Удалить","delete-project:"+p.id,"danger")+'</div></div>'}).join(""):'<div class="card empty"><b>▤</b>Проектов пока нет. Добавь проект и свяжи его с записью в календаре.</div>')}

function studentsPage(){return title("Ученики","Сроки обучения и домашние задания")+'<div class="btnrow">'+btn("＋ Добавить ученика","new-student","primary")+'</div>'+(modal?studentForm():"")+(state.students.length?state.students.map(s=>'<div class="card" style="margin-top:12px"><div class="row"><div><h3>'+esc(s.name)+'</h3><div class="muted small">Оплачено '+s.paidDays+' дней · до '+esc(s.until||"не указано")+'</div></div><span class="tag gold">'+esc(s.status||"Обучается")+'</span></div><div class="field"><label>Домашняя работа</label><textarea id="hw-'+s.id+'">'+esc(s.homework||"Отработать постановку руки, контур и градиент на искусственной коже.")+'</textarea></div><div class="btnrow">'+btn("Сгенерировать задание","generate-hw:"+s.id,"primary")+btn("Скопировать","copy-hw:"+s.id)+btn("−1 день","student-day:"+s.id)+btn("Удалить","delete-student:"+s.id,"danger")+'</div></div>').join(""):'<div class="card empty"><b>✎</b>Добавь ученика, срок оплаты и домашние задания.</div>')+'<div class="notice" style="margin-top:12px">AI-генерация требует подключения AI API. Пока можно редактировать задание и копировать его ученику.</div>'}
function studentForm(){return '<div class="card" style="margin-top:12px"><h3>Новый ученик</h3><form id="studentForm"><div class="field"><label>Имя ученика</label><input name="name" required></div><div class="formgrid"><div class="field"><label>Оплачено дней</label><input name="paidDays" type="number" min="1" value="30"></div><div class="field"><label>Оплачено до</label><input name="until" type="date"></div></div><button class="btn primary">Сохранить ученика</button></form></div>'}
function stockPage(){return title("Расходники","Остатки и минимальные запасы")+'<div class="btnrow">'+btn("＋ Добавить позицию","new-stock","primary")+btn("Заказать расходники","open-shop")+'</div>'+(modal?stockForm():"")+(state.stock.map(s=>'<div class="card" style="margin-top:10px"><div class="row"><div><h3 style="margin-bottom:3px">'+esc(s.name)+'</h3><div class="muted small">'+esc(s.brand||"Производитель не указан")+'</div></div><div style="text-align:right"><div style="font-size:23px;font-weight:800;color:'+(s.count<=s.min?'var(--red)':'var(--gold)')+'">'+s.count+'</div><div class="muted small">'+esc(s.unit||"шт.")+' · минимум '+s.min+'</div></div></div>'+(s.count<=s.min?'<div class="notice" style="margin:10px 0">⚠️ Остаток ниже минимального — пополни запас.</div>':'')+'<div class="btnrow" style="margin-top:12px">'+btn("−","stock-change:"+s.id+":-1")+btn("+","stock-change:"+s.id+":1")+btn("Изменить","edit-stock:"+s.id)+btn("Удалить","delete-stock:"+s.id,"danger")+'</div></div>').join(""))+'<p class="footnote">Уведомления на этой странице показываются при открытии приложения. Фоновые push-уведомления требуют серверной настройки.</p>'}
function stockForm(s){s=s||{};return '<div class="card" style="margin-top:12px"><h3>'+(s.id?"Изменить позицию":"Новый расходник")+'</h3><form id="stockForm"><input type="hidden" name="id" value="'+esc(s.id||"")+'"><div class="field"><label>Категория</label><select name="name">'+["Картриджи","Трансферная бумага","Бандажный бинт","Другое"].map(n=>'<option '+((s.name||"Картриджи")===n?"selected":"")+'>'+n+'</option>').join("")+'</select></div><div class="formgrid"><div class="field"><label>Фирма / размер</label><input name="brand" value="'+esc(s.brand||"")+'"></div><div class="field"><label>Остаток</label><input name="count" type="number" min="0" value="'+Number(s.count||0)+'"></div><div class="field"><label>Минимум</label><input name="min" type="number" min="0" value="'+Number(s.min||5)+'"></div><div class="field"><label>Единица</label><input name="unit" value="'+esc(s.unit||"шт.")+'"></div></div><button class="btn primary">Сохранить</button></form></div>'}
function formsPage(){const fs=[["session","Согласие на сеанс","Информация о процедуре, противопоказаниях, уходе и подтверждение ознакомления клиента."],["minor","Форма для несовершеннолетнего","Не использовать без проверки применимого законодательства и допустимости процедуры."],["photo","Согласие на публикацию фото","Отдельное добровольное разрешение на размещение фото татуировки в интернете и рекламе."],["model","Согласие модели","Съёмка и использование фото/видео модели для портфолио и рекламных материалов."]];return title("Анкеты и согласия","Статус подготовки документов")+'<div class="notice">Это чек-лист и шаблоны, а не юридически проверенные документы. Согласия на процедуру, обработку персональных данных и рекламу оформляй раздельно. Несовершеннолетние — только после проверки закона и правил студии.</div>'+fs.map(f=>{const saved=state.forms.find(x=>x.id===f[0]);return '<div class="card" style="margin-top:12px"><div class="row"><h3>'+f[1]+'</h3><span class="tag '+(saved?'gold':'')+'">'+(saved?'Заполнено':'Не заполнено')+'</span></div><p class="muted small">'+f[2]+'</p><div class="btnrow">'+btn(saved?"Редактировать":"Открыть форму","form-open:"+f[0],"primary")+'</div>'+(modal===f[0]?formEditor(f[0],f[1],saved):"")+'</div>'}).join("")}
function formEditor(id,name,f){f=f||{};return '<form data-form-id="'+id+'" class="consent-form"><div class="field"><label>ФИО клиента</label><input name="person" required value="'+esc(f.person||"")+'"></div><div class="field"><label>Дата</label><input name="date" type="date" required value="'+esc(f.date||iso(today))+'"></div><div class="field"><label>Текст / примечание к согласию</label><textarea name="text" required>'+esc(f.text||name+". Я подтверждаю, что получил(а) объяснение, мог(ла) задать вопросы и добровольно выражаю своё согласие в пределах выбранного документа.")+'</textarea></div>'+(id==="photo"?'<div class="checkrow"><input type="checkbox" name="face" '+(f.face?"checked":"")+'><label>Разрешаю публикацию с лицом</label></div><div class="checkrow"><input type="checkbox" name="noFace" '+(f.noFace?"checked":"")+'><label>Разрешаю публикацию без лица</label></div>':"")+'<div class="checkrow"><input type="checkbox" name="confirmed" required '+(f.confirmed?"checked":"")+'><label>Отметка мастера: согласие получено и условия объяснены</label></div><button class="btn primary">Сохранить форму</button></form>'}
function wire(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;viewMonth=new Date(selectedDate+"T12:00:00");render()});const ef=document.getElementById("eventForm");if(ef)ef.onsubmit=saveEvent;const cf=document.getElementById("clientForm");if(cf)cf.onsubmit=saveClient;const pf=document.getElementById("projectForm");if(pf)pf.onsubmit=saveProject;const sf=document.getElementById("studentForm");if(sf)sf.onsubmit=saveStudent;const stf=document.getElementById("stockForm");if(stf)stf.onsubmit=saveStock;const xf=document.getElementById("expenseForm");if(xf)xf.onsubmit=saveExpense;document.querySelectorAll(".consent-form").forEach(f=>f.onsubmit=saveConsent);const search=document.getElementById("clientSearch");if(search)search.oninput=()=>document.querySelectorAll(".client-card").forEach(c=>c.classList.toggle("hidden",!c.dataset.search.includes(search.value.toLowerCase())))}
function action(a){const [cmd,id,extra]=a.split(":");if(cmd==="go-calendar")return setPage("calendar");if(cmd==="go-stock")return setPage("stock");if(cmd==="new-event"){page="calendar";modal=true;return render()}if(cmd==="close-modal"){modal=false;return render()}if(cmd==="prev-month"){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);return render()}if(cmd==="next-month"){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);return render()}if(cmd==="new-client"){page="clients";modal=true;return render()}if(cmd==="new-project"){page="projects";modal=true;return render()}if(cmd==="new-student"){page="students";modal=true;return render()}if(cmd==="new-stock"){page="stock";modal=true;return render()}if(cmd==="new-expense"){page="finance";modal=true;return render()}if(cmd==="edit-event"){modal=true;const e=state.events.find(x=>x.id===id);document.getElementById("content").innerHTML=calendarPage().replace(eventForm(),eventForm(e));wire();return}if(cmd==="delete-event"){if(confirm("Удалить запись?")){state.events=state.events.filter(e=>e.id!==id);save();render()}return}if(cmd==="toggle-client"){const el=document.getElementById("details-"+id);if(el)el.classList.toggle("hidden");return}if(cmd==="edit-client"){modal=false;render();document.getElementById("content").insertAdjacentHTML("afterbegin",clientForm(state.clients.find(c=>c.id===id)));wire();return}if(cmd==="delete-client"){if(confirm("Удалить карточку клиента?")){state.clients=state.clients.filter(c=>c.id!==id);save();render()}return}if(cmd==="export-clients"){const csv=["Имя,Телефон,Соцсеть,Заметки",...state.clients.map(c=>[c.name,c.phone,c.social,c.notes].map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(","))].join("\n");download("clients.csv",csv);return}if(cmd==="new-expense"){modal=true;render();return}if(cmd==="delete-expense"){state.expenses=state.expenses.filter(e=>e.id!==id);save();render();return}if(cmd==="new-project"){modal=true;render();return}if(cmd==="project-add-session"){const p=state.projects.find(x=>x.id===id);if(p){state.events.push({id:uid(),date:selectedDate,time:"12:00",name:p.client||p.name,type:"Сеанс",price:0,minutes:180,payment:"planned",deposit:0,note:"Сеанс проекта",projectId:id,status:"done"});save();toast("Сеанс добавлен");render()}return}if(cmd==="project-increase"){const p=state.projects.find(x=>x.id===id);if(p){p.planned=Number(p.planned)+1;save();render()}return}if(cmd==="delete-project"){if(confirm("Удалить проект?")){state.projects=state.projects.filter(x=>x.id!==id);save();render()}return}if(cmd==="new-student"){modal=true;render();return}if(cmd==="generate-hw"){const s=state.students.find(x=>x.id===id);if(s){s.homework="Домашняя работа для "+s.name+":\n1. Разминка линий и кругов — 15 минут.\n2. Отработать ровный контур и изменение толщины линий на искусственной коже.\n3. Сделать 3 градиента от чёрного к светлому.\n4. Сфотографировать результат при нейтральном свете.\n5. Прислать фото и отметить, что было сложнее всего.";save();render();toast("Задание подготовлено. Проверь и скопируй.")}return}if(cmd==="copy-hw"){const s=state.students.find(x=>x.id===id);if(s)copyText(s.homework||"");return}if(cmd==="student-day"){const s=state.students.find(x=>x.id===id);if(s){s.paidDays=Math.max(0,Number(s.paidDays)-1);save();render()}return}if(cmd==="delete-student"){if(confirm("Удалить ученика?")){state.students=state.students.filter(x=>x.id!==id);save();render()}return}if(cmd==="open-shop"){window.open(state.settings.shop,"_blank","noopener");return}if(cmd==="edit-stock"){modal=false;render();document.getElementById("content").insertAdjacentHTML("afterbegin",stockForm(state.stock.find(x=>x.id===id)));wire();return}if(cmd==="stock-change"){const delta=Number(extra);const s=state.stock.find(x=>x.id===id);if(s){s.count=Math.max(0,s.count+delta);save();render()}return}if(cmd==="delete-stock"){if(confirm("Удалить позицию?")){state.stock=state.stock.filter(x=>x.id!==id);save();render()}return}if(cmd==="form-open"){modal=id;render();return}}
function saveEvent(ev){ev.preventDefault();const f=new FormData(ev.target),id=f.get("id");const e={id:id||uid(),name:f.get("name").trim(),date:f.get("date"),time:f.get("time"),type:f.get("type"),price:Number(f.get("price")||0),minutes:Number(f.get("minutes")||0),payment:f.get("payment"),deposit:Number(f.get("deposit")||0),note:f.get("note").trim(),projectId:f.get("projectId")||"",status:"planned"};const client=state.clients.find(c=>c.name.toLowerCase()===e.name.toLowerCase());if(client)e.clientId=client.id;if(id){const i=state.events.findIndex(x=>x.id===id);if(i>=0)state.events[i]=e}else state.events.push(e);if(!client&&!Object.keys(TYPES).slice(3).includes(e.type)&&e.name){state.clients.push({id:uid(),name:e.name,phone:"",social:"",notes:"",photo:"",createdAt:e.date})}selectedDate=e.date;viewMonth=dateObj(e.date);modal=false;save();render();toast("Запись сохранена")}
function saveClient(ev){ev.preventDefault();const f=new FormData(ev.target),id=f.get("id"),c={id:id||uid(),name:f.get("name").trim(),phone:f.get("phone").trim(),social:f.get("social").trim(),photo:f.get("photo").trim(),notes:f.get("notes").trim()};if(id){state.clients=state.clients.map(x=>x.id===id?c:x)}else state.clients.push(c);modal=false;save();render();toast("Клиент сохранён")}
function saveProject(ev){ev.preventDefault();const f=new FormData(ev.target);state.projects.push({id:uid(),name:f.get("name").trim(),kind:f.get("kind"),planned:Number(f.get("planned")||1),client:f.get("client")});modal=false;save();render();toast("Проект создан")}
function saveStudent(ev){ev.preventDefault();const f=new FormData(ev.target);state.students.push({id:uid(),name:f.get("name").trim(),paidDays:Number(f.get("paidDays")||0),until:f.get("until"),homework:"Отработать постановку руки, контур и градиент на искусственной коже.",status:"Обучается"});modal=false;save();render();toast("Ученик добавлен")}
function saveStock(ev){ev.preventDefault();const f=new FormData(ev.target),id=f.get("id"),s={id:id||uid(),name:f.get("name"),brand:f.get("brand"),count:Number(f.get("count")||0),min:Number(f.get("min")||0),unit:f.get("unit")||"шт."};if(id)state.stock=state.stock.map(x=>x.id===id?s:x);else state.stock.push(s);modal=false;save();render();toast("Склад обновлён")}
function saveExpense(ev){ev.preventDefault();const f=new FormData(ev.target);state.expenses.push({id:uid(),title:f.get("title").trim(),amount:Number(f.get("amount")||0),date:f.get("date")});modal=false;save();render();toast("Расход сохранён")}
function saveConsent(ev){ev.preventDefault();const f=new FormData(ev.target),id=ev.target.dataset.formId,record={id,person:f.get("person"),date:f.get("date"),text:f.get("text"),confirmed:f.get("confirmed")==="on",face:f.get("face")==="on",noFace:f.get("noFace")==="on"};state.forms=state.forms.filter(x=>x.id!==id);state.forms.push(record);modal=false;save();render();toast("Форма сохранена")}

async function initAuth(){
 const overlay=document.getElementById("authOverlay");
 document.getElementById("offlineMode").onclick=()=>{overlay.classList.add("hidden");cloudReady=false;toast("Офлайн-режим: данные хранятся только в этом браузере")};
 if(!window.supabase||!window.supabase.createClient){document.getElementById("authMessage").textContent="Не загрузился сервис аккаунтов. Проверь интернет или выбери офлайн-режим.";return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);document.getElementById("accountButton").onclick=signOut;
 document.getElementById("authForm").onsubmit=async ev=>{ev.preventDefault();if(authBusy)return;authBusy=true;const f=new FormData(ev.target),email=String(f.get("email")||"").trim(),password=String(f.get("password")||""),msg=document.getElementById("authMessage");msg.textContent="Подключаем аккаунт…";try{const res=authMode==="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(res.error)throw res.error;if(authMode==="register"&&!res.data.session){msg.textContent="Аккаунт создан. Подтверди email и затем войди.";return}if(res.data.session)await enterAccount(res.data.session.user)}catch(e){msg.textContent=e.message||"Ошибка авторизации"}finally{authBusy=false}};
 document.getElementById("authToggle").onclick=()=>{authMode=authMode==="login"?"register":"login";document.getElementById("authTitle").textContent=authMode==="login"?"Вход в аккаунт":"Создание аккаунта";document.getElementById("authSubmit").textContent=authMode==="login"?"Войти":"Зарегистрироваться";document.getElementById("authToggle").textContent=authMode==="login"?"Создать аккаунт":"У меня уже есть аккаунт";document.getElementById("authDesc").textContent=authMode==="login"?"Данные клиентов и финансов доступны только в твоём аккаунте.":"Создай личный аккаунт для синхронизации данных между устройствами."};
 document.getElementById("offlineMode").onclick=()=>{overlay.classList.add("hidden");cloudReady=false;toast("Офлайн-режим: данные хранятся только в этом браузере")};
 const {data,error}=await sb.auth.getSession();if(!error&&data.session)await enterAccount(data.session.user);
 sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;cloudReady=false;state=defaults();localStorage.setItem(KEY,JSON.stringify(state));overlay.classList.remove("hidden");render()}});
}
async function enterAccount(user){
 if(!user)return;currentUser=user;cloudReady=false;document.getElementById("authMessage").textContent="Загружаем твои данные…";
 try{const {data,error}=await sb.from("inkos_studio_user_data").select("data").eq("user_id",user.id).maybeSingle();if(error)throw error;if(data&&data.data){state=Object.assign(defaults(),data.data);localStorage.setItem(KEY,JSON.stringify(state))}else{state=defaults();localStorage.setItem(KEY,JSON.stringify(state));const {error:saveError}=await sb.from("inkos_studio_user_data").upsert({user_id:user.id,data:state},{onConflict:"user_id"});if(saveError)throw saveError}cloudReady=true;document.getElementById("authOverlay").classList.add("hidden");render();toast("Аккаунт подключён — облачная синхронизация включена")}catch(e){document.getElementById("authMessage").textContent="Не удалось загрузить облачные данные: "+(e.message||"ошибка");currentUser=null;cloudReady=false}
}
function setSyncMessage(message){const el=document.getElementById("authMessage");if(el&&currentUser)el.textContent=message}

function copyText(s){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast("Скопировано")).catch(()=>fallbackCopy(s));else fallbackCopy(s)}
function fallbackCopy(s){const t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("Скопировано")}
function download(name,content){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+content],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
// Re-render forms and action handlers using delegated events.
document.addEventListener("click",function(ev){const b=ev.target.closest("[data-action]");if(b){return; const a=b.dataset.action;if(a.startsWith("edit-event:")){const e=state.events.find(x=>x.id===a.split(":")[1]);if(e){modal=true;render();const c=document.getElementById("content");c.innerHTML=calendarPage().replace(eventForm(),eventForm(e));wire()}return}if(a.startsWith("edit-client:")){const c=state.clients.find(x=>x.id===a.split(":")[1]);modal=true;render();document.getElementById("content").insertAdjacentHTML("afterbegin",clientForm(c));wire();return}if(a.startsWith("edit-stock:")){const s=state.stock.find(x=>x.id===a.split(":")[1]);modal=true;render();document.getElementById("content").insertAdjacentHTML("afterbegin",stockForm(s));wire();return}if(a.startsWith("form-open:")){modal=a.split(":")[1];render();return}if(a.startsWith("delete-")||a.startsWith("project-")||a.startsWith("student-")||a.startsWith("stock-")||a.startsWith("toggle-")||a.startsWith("new-")||a==="open-shop"||a==="go-stock"||a==="go-calendar"||a==="close-modal"||a==="prev-month"||a==="next-month"||a==="export-clients"){action(a)}}});
const originalRender=render;
render=function(){originalRender();if(page==="calendar"&&modal){const c=document.getElementById("content");if(!c.innerHTML.includes('id="eventForm"'))c.insertAdjacentHTML("beforeend",eventForm());wire()}if(page==="clients"&&modal&&!document.getElementById("clientForm")){document.getElementById("content").insertAdjacentHTML("afterbegin",clientForm());wire()}if(page==="finance"&&modal&&!document.getElementById("expenseForm")){document.querySelector(".card:last-of-type")?.insertAdjacentHTML("beforeend",expenseForm());wire()}if(page==="projects"&&modal&&!document.getElementById("projectForm")){document.getElementById("content").insertAdjacentHTML("beforeend",projectForm());wire()}if(page==="students"&&modal&&!document.getElementById("studentForm")){document.getElementById("content").insertAdjacentHTML("beforeend",studentForm());wire()}if(page==="stock"&&modal&&!document.getElementById("stockForm")){document.getElementById("content").insertAdjacentHTML("beforeend",stockForm());wire()}};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
initAuth();
})();
</script>
</body>
</html>
