name: Deploy INK.OS website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('ink.os/index.html', 'utf8');
          const scripts = [];
          const parts = html.split(/<script\\b/i).slice(1);
          for (const part of parts) {
            const close = part.indexOf('</script>');
            if (close < 0) continue;
            const open = part.indexOf('>');
            if (open < 0 || open > close) continue;
            const source = part.slice(open + 1, close);
            if (source.trim()) scripts.push(source);
          }
          scripts.forEach((source, index) => {
            try {
              new vm.Script(source, { filename: `inline-script-${index + 1}.js` });
            } catch (error) {
              console.error(error.stack);
              process.exitCode = 1;
            }
          });
          if (!process.exitCode) console.log(`Validated ${scripts.length} inline script(s).`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
